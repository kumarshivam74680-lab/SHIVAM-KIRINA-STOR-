<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shivam Kirana Store</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#198754;
  color:white;
  text-align:center;
  padding:20px 10px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  margin-bottom:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}

.product{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 2px 8px #ccc;
  text-align:center;
}

.product h3{
  margin:8px 0;
}

.price{
  font-weight:bold;
  color:#198754;
  margin:8px;
}

button{
  background:#198754;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
}

.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px 20px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:25px;
  margin-top:30px;
  background:#222;
  color:white;
}
</style>
</head>

<body>

<header>
  <h1>🛒 SHIVAM KIRANA STORE</h1>
  <p>घर बैठे किराना सामान ऑर्डर करें</p>
</header>

<div class="container">

<input
  class="search"
  type="text"
  placeholder="🔎 सामान खोजें..."
  onkeyup="searchProduct()"
  id="search"
>

<div class="products" id="products">

<div class="product">
  <h3>🍚 चावल</h3>
  <div class="price">₹60 / kg</div>
  <button onclick="order('चावल')">WhatsApp Order</button>
</div>

<div class="product">
  <h3>🌾 आटा</h3>
  <div class="price">₹45 / kg</div>
  <button onclick="order('आटा')">WhatsApp Order</button>
</div>

<div class="product">
  <h3>🍬 चीनी</h3>
  <div class="price">₹50 / kg</div>
  <button onclick="order('चीनी')">WhatsApp Order</button>
</div>

<div class="product">
  <h3>🫘 दाल</h3>
  <div class="price">₹100 / kg</div>
  <button onclick="order('दाल')">WhatsApp Order</button>
</div>

<div class="product">
  <h3>🫗 सरसों तेल</h3>
  <div class="price">₹140 / litre</div>
  <button onclick="order('सरसों तेल')">WhatsApp Order</button>
</div>

<div class="product">
  <h3>🧂 नमक</h3>
  <div class="price">₹25 / kg</div>
  <button onclick="order('नमक')">WhatsApp Order</button>
</div>

<div class="product">
  <h3>🍪 बिस्कुट</h3>
  <div class="price">₹10 से शुरू</div>
  <button onclick="order('बिस्कुट')">WhatsApp Order</button>
</div>

<div class="product">
  <h3>☕ चाय</h3>
  <div class="price">₹50 / 250g</div>
  <button onclick="order('चाय')">WhatsApp Order</button>
</div>

</div>
</div>

<a class="whatsapp"
href="https://wa.me/919546100802"
target="_blank">
💬 WhatsApp Order
</a>

<footer>
  © 2026 Shivam Kirana Store<br>
  घर बैठे सामान ऑर्डर करें
</footer>

<script>

function order(product){

  let message =
  "नमस्ते Shivam Kirana Store,%0A%0A" +
  "मुझे " + product +
  " ऑर्डर करना है।%0A%0A" +
  "नाम:%0A" +
  "पता:%0A" +
  "मात्रा:";

  window.open(
    "https://wa.me/919546100802?text=" + message,
    "_blank"
  );
}

function searchProduct(){

  let input =
  document.getElementById("search")
  .value.toLowerCase();

  let products =
  document.querySelectorAll(".product");

  products.forEach(function(product){

    let text =
    product.innerText.toLowerCase();

    if(text.includes(input)){
      product.style.display="block";
    }else{
      product.style.display="none";
    }

  });
}

</script>

</body>
</html>
